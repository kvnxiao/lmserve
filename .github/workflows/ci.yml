name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Install development tools
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just cargo-audit cargo-machete dprint
      - name: Verify workspace
        run: |
          just --list
          just verify

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable and task runner
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo +stable install --locked just
      - name: Check each workspace member
        shell: bash
        run: |
          just --list
          metadata=$(cargo +stable metadata --no-deps --format-version 1 --locked)
          packages=$(jq -r '.workspace_members as $members | .packages[] | select(.id as $id | $members | index($id)) | .name' <<< "$metadata")
          while IFS= read -r package; do
            just check-msrv "$package"
          done <<< "$packages"
